<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Bingo - Deposit</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .step-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .step-title {
            font-weight: bold;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
        }
        input, textarea {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .quick-amounts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .amt-btn {
            background-color: #334155;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .amt-btn:hover { background-color: #475569; }
        .verify-btn {
            background: linear-gradient(to right, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .verify-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-top: 16px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }
        .alert-success { background-color: #064e3b; border: 1px solid #059669; color: #a7f3d0; }
        .alert-error { background-color: #7f1d1d; border: 1px solid #dc2626; color: #fecaca; }
        .alert-warning { background-color: #78350f; border: 1px solid #d97706; color: #fde68a; }
        .copy-btn {
            background-color: #2563eb; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; float: right; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Dash Bingo ⚡ ማረጋገጫ</h2>

    <!-- Step 1 -->
    <div class="step-card">
        <div class="step-title">1. የሚያስገቡትን የብር መጠን ይምረጡ</div>
        <div class="quick-amounts">
            <button class="amt-btn" onclick="setAmount(50)">50 ብር</button>
            <button class="amt-btn" onclick="setAmount(100)">100 ብር</button>
            <button class="amt-btn" onclick="setAmount(200)">200 ብር</button>
            <button class="amt-btn" onclick="setAmount(500)">500 ብር</button>
        </div>
        <input type="number" id="amountInput" placeholder="የብር መጠን (ቢያንስ 50 ብር)" min="50">
    </div>

    <!-- Step 2 -->
    <div class="step-card">
        <div class="step-title">2. ብሩን በቴሌብር ይላኩ</div>
        <p style="font-size: 14px; margin: 0 0 8px 0;">ወደዚህ የቴሌብር አካውንት ይላኩ፦</p>
        <div style="background-color: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #334155;">
            <strong>0996910607</strong> (Aymen)
            <button class="copy-btn" onclick="copyPhone()">ኮፒ አድርግ</button>
        </div>
        <p id="sendInstruction" style="font-size: 12px; color: #cbd5e1; margin-top: 8px;"></p>
    </div>

    <!-- Step 3 -->
    <div class="step-card">
        <div class="step-title">3. የግብይት ቁጥሩን (Ref) ያስገቡ</div>
        <textarea id="refInput" rows="3" placeholder="ምሳሌ፡ DJC5Q7Q5UV ወይም ሙሉውን የቴሌብር SMS እዚህ Paste ያድርጉ..."></textarea>
        
        <button id="verifyBtn" class="verify-btn" onclick="verifyTransaction()">⚡ አረጋግጥና አስገባ (Verify)</button>
    </div>

    <!-- Alerts -->
    <div id="statusAlert" class="alert"></div>
</div>

<script>
    // 1. Amount ሲጻፍ መመሪያውን መቀየር
    const amountInput = document.getElementById('amountInput');
    const sendInstruction = document.getElementById('sendInstruction');

    amountInput.addEventListener('input', () => {
        const amt = amountInput.value;
        if(amt && amt >= 50) {
            sendInstruction.innerHTML = `አሁን ወደ 0996910607 በትክክል <b>${amt} ETB</b> ይላኩ።`;
        } else {
            sendInstruction.innerHTML = "";
        }
    });

    function setAmount(val) {
        amountInput.value = val;
        amountInput.dispatchEvent(new Event('input'));
    }

    function copyPhone() {
        navigator.clipboard.writeText("0996910607");
        alert("የስልክ ቁጥሩ ኮፒ ተደርጓል!");
    }

    // 2. ዋናው የማረጋገጫ ስራ (API Call)
    async function verifyTransaction() {
        let rawRef = document.getElementById('refInput').value.trim();
        let amount = amountInput.value.trim();
        const verifyBtn = document.getElementById('verifyBtn');
        const alertBox = document.getElementById('statusAlert');

        alertBox.style.display = 'none';
        alertBox.className = 'alert';

        // ሙሉ SMS ከተለጠፈ ፈልጎ ማውጣት (Regex Extract)
        if (rawRef.length > 15) {
            const refMatch = rawRef.match(/transaction\s*(?:number|no|id)\s*(?:is)?[\s:]*([A-Z0-9]{10,12})\b/i) || rawRef.match(/\b([A-Z0-9]{10,12})\b/);
            if (refMatch) rawRef = refMatch[1].toUpperCase();

            const amtMatch = rawRef.match(/(?:transferred|paid)\s+(?:ETB|Birr)\s*([0-9,]+(?:\.[0-9]{1,2})?)/i);
            if (amtMatch && !amount) {
                amount = amtMatch[1].replace(/,/g, '');
                amountInput.value = amount; // ሳጥኑ ላይ ራሱ ይሞላዋል
            }
        }

        // ማጣሪያዎች
        if (!amount || amount < 50) {
            showAlert("⚠️ እባክዎ ትክክለኛ የብር መጠን ያስገቡ (ቢያንስ 50 ብር)።", "alert-warning");
            return;
        }
        if (!rawRef || rawRef.length < 9) {
            showAlert("⚠️ እባክዎ ትክክለኛ ባለ 10 ፊደል የቴሌብር የግብይት ቁጥር (Ref) ያስገቡ።", "alert-warning");
            return;
        }

        // ወደ ሰርቨር ጥያቄ መላክ
        verifyBtn.disabled = true;
        verifyBtn.innerText = "⏳ በማረጋገጥ ላይ...";

        try {
            // የአንተን ትክክለኛ የ Render ኤፒአይ ሊንክ እዚህ ተጠቅመናል!
            const apiUrl = `https://verifi-server.onrender.com/api/verify?token=Verifi_Prod_9842_Aymen_X9!2026&ref=${rawRef}&amount=${amount}`;
            
            const response = await fetch(apiUrl);
            const data = await response.json();

            // መልሶችን ማስተናገድ
            if (data.status === 'Verified') {
                showAlert(`🎉 ክፍያዎ ተረጋግጧል! ${data.amount} ብር ወደ አካውንትዎ ገቢ ተደርጓል።`, "alert-success");
                verifyBtn.innerText = "✅ ተረጋግጧል";
                // እዚህ ጋር ወደ ዳሽቦርድ መመለስ ትችላለህ (ለምሳሌ: window.location.href = '/dashboard';)
            } 
            else if (data.status === 'Pending') {
                showAlert("⏳ ክፍያው ገና አልደረሰም ወይም ያስገቡት የግብይት ቁጥር (Ref) ተሳስቷል። እባክዎ ከ 5 ሰከንድ በኋላ ድጋሚ ይሞክሩ።", "alert-warning");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "⚡ አረጋግጥና አስገባ (Verify)";
            } 
            else if (data.status === 'InvalidAmount') {
                showAlert(`⚠️ ያስገቡት የብር መጠን (${data.expected} ብር) በቴሌብር ከላኩት (${data.actual} ብር) ጋር አይตรงም! እባክዎ የብር መጠኑን ${data.actual} ብለው አስተካክለው ድጋሚ ይሞክሩ።`, "alert-warning");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "⚡ አረጋግጥና አስገባ (Verify)";
            } 
            else if (data.status === 'AlreadyUsed') {
                showAlert("❌ ይህ የግብይት ቁጥር (Ref) ቀድሞ ጥቅም ላይ ውሏል! በድጋሚ መጠቀም አይቻልም።", "alert-error");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "⚡ አረጋግጥና አስገባ (Verify)";
            } 
            else {
                showAlert("❌ ይህ ትክክለኛ የገቢ ክፍያ ቁጥር አይደለም።", "alert-error");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "⚡ አረጋግጥና አስገባ (Verify)";
            }

        } catch (error) {
            showAlert("⚠️ ከሰርቨር ጋር መገናኘት አልተቻለም። ኢንተርኔትዎን አረጋግጠው ድጋሚ ይሞክሩ።", "alert-error");
            verifyBtn.disabled = false;
            verifyBtn.innerText = "⚡ አረጋግጥና አስገባ (Verify)";
        }
    }

    function showAlert(message, className) {
        const alertBox = document.getElementById('statusAlert');
        alertBox.innerText = message;
        alertBox.className = `alert ${className}`;
        alertBox.style.display = 'block';
    }
</script>
</body>
</html>
