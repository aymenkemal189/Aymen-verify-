<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Payment Gateway</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Ethiopic',sans-serif}</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
<div class="bg-white p-6 rounded-2xl shadow-2xl max-w-lg w-full border border-gray-100">

  <div id="amountCard" class="bg-gray-50 rounded-xl p-4 mb-5 border border-gray-200">
    <h3 class="text-gray-500 text-xs font-bold">የክፍያ መጠን</h3>
    <p class="text-2xl font-extrabold text-gray-800 mt-1"><span id="price">—</span> <span class="text-sm font-normal text-gray-500">ብር</span></p>
    <p class="text-xs text-gray-400 mt-1">ትዕዛዝ: <span id="orderId">—</span></p>
  </div>

  <p class="font-bold text-gray-800 text-sm mb-2">1. ክፍያ ይፈጽሙ (ከሁለቱ አንዱን)</p>
  <div id="payBox" class="grid gap-3 mb-6"></div>

  <p class="font-bold text-gray-800 text-sm mb-2">2. ክፍያዎን ያረጋግጡ</p>
  <div class="mb-4 bg-gray-100 p-1.5 rounded-lg flex text-sm text-center border border-gray-200">
    <button id="tab-image" onclick="setMethod('image')" class="flex-1 py-2 rounded-md">ደረሰኝ ፎቶ</button>
    <button id="tab-sms" onclick="setMethod('sms')" class="flex-1 py-2 rounded-md">ሙሉ SMS</button>
    <button id="tab-trx" onclick="setMethod('trx')" class="flex-1 py-2 rounded-md">Trx No</button>
  </div>

  <div id="input-image" class="mb-6">
    <div id="uploadBox" onclick="$('receiptImage').click()" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center bg-gray-50 cursor-pointer">
      <p class="text-sm text-gray-600 font-medium">የክፍያ ስክሪንሹት ይምረጡ</p>
      <input type="file" id="receiptImage" accept="image/*" class="hidden" onchange="previewImage(this)">
    </div>
    <div id="previewBox" class="hidden mt-2 relative border border-gray-200 bg-gray-50 p-2 rounded-lg">
      <img id="preview" class="w-full h-40 object-contain" alt="">
      <button onclick="clearImage()" class="absolute top-2 right-2 bg-red-500 text-white rounded-full w-7 h-7">✕</button>
    </div>
  </div>
  <div id="input-sms" class="mb-6 hidden">
    <textarea id="smsText" rows="4" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-gray-50" placeholder="ከባንክ የደረሰዎትን ሙሉ SMS እዚህ Paste ያድርጉ..."></textarea>
  </div>
  <div id="input-trx" class="mb-6 hidden">
    <input id="trxText" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-gray-50 text-center font-bold tracking-wider" placeholder="FT26... ወይም የ v2 ሊንክ ወይም Telebirr Trx No">
  </div>

  <button id="verifyBtn" onclick="verifyPayment()" class="w-full text-white font-bold py-3.5 rounded-lg shadow-lg" style="background:#592565">
    <span id="btnText">ክፍያውን አረጋግጥ</span>
  </button>

  <div id="resultBox" class="mt-5 hidden p-4 rounded-xl border text-sm">
    <h3 id="resultTitle" class="font-bold text-base mb-1"></h3>
    <p id="resultDetails" class="text-gray-600 whitespace-pre-line leading-relaxed"></p>
  </div>
</div>

<script>
  // የ Apps Script /exec URL ብቻ ተካ
  const API_URL = "https://script.google.com/macros/s/AKfycbxdSqYG6JvTJYX2UKDDMIurhruE0uGUUy6TZ3RQ8pONy8TU7axkPiMZkHJBHe7SUEg-uw/exec";

  const PAY_TO = {
    CBE:      { label: "ንግድ ባንክ", color: "#592565", number: "1000562339427", name: "Aymen Kemal Ali" },
    Telebirr: { label: "ቴሌብር",     color: "#00B5E2", number: "0996910607",    name: "Aymen" }
  };

  const q = new URLSearchParams(location.search);
  const ORDER = q.get("order") || "", AMOUNT = q.get("amount") || "", SIG = q.get("sig") || "";
  const HAS_LINK = !!(ORDER || AMOUNT || SIG);
  const LINK_OK = !!(ORDER && parseFloat(AMOUNT) > 0 && SIG);
  const $ = (id) => document.getElementById(id);
  let method = "image";

  if (HAS_LINK) { $("price").textContent = AMOUNT || "—"; $("orderId").textContent = ORDER || "—"; }
  else $("amountCard").classList.add("hidden");

  for (const k of Object.keys(PAY_TO)) {
    const c = PAY_TO[k], d = document.createElement("div");
    d.className = "rounded-xl border-2 p-3 text-sm";
    d.style.borderColor = c.color;
    d.innerHTML = '<p class="font-bold" style="color:' + c.color + '">' + c.label + '</p><p class="text-gray-600">' + c.name +
      '</p><button class="mt-1 text-lg font-extrabold tracking-wider text-gray-900 underline decoration-dotted">' + c.number +
      '</button><p class="hint text-xs text-gray-400 mt-1">ቁጥሩን ለመቅዳት ይንኩት</p>';
    d.querySelector("button").onclick = () => copyText(c.number, d.querySelector(".hint"));
    $("payBox").appendChild(d);
  }

  function copyText(text, hint) {
    const t = document.createElement("textarea");
    t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); hint.textContent = "ተቀድቷል ✓"; } catch (e) {}
    document.body.removeChild(t);
  }

  function setMethod(m) {
    method = m; hideResult();
    for (const k of ["image", "sms", "trx"]) {
      $("input-" + k).classList.toggle("hidden", k !== m);
      $("tab-" + k).className = "flex-1 py-2 rounded-md " + (k === m ? "bg-white shadow font-semibold text-gray-900" : "text-gray-500");
    }
  }

  function previewImage(input) {
    if (!input.files[0]) return;
    const r = new FileReader();
    r.onload = (e) => { $("preview").src = e.target.result; $("uploadBox").classList.add("hidden"); $("previewBox").classList.remove("hidden"); };
    r.readAsDataURL(input.files[0]);
  }

  function clearImage() {
    $("receiptImage").value = ""; $("preview").src = "";
    $("previewBox").classList.add("hidden"); $("uploadBox").classList.remove("hidden");
  }

  // ከፎቶ OCR፣ ሙሉ SMS፣ ሊንክ ወይም Trx No የክፍያ ማጣቀሻ ያወጣል
  function extractRef(text, direct) {
    text = String(text || "");
    let m = text.match(/mbreciept\.cbe\.com\.et\/([a-zA-Z0-9-]+)/i);
    if (m) return m[1];
    m = text.match(/\b(v2-[a-zA-Z0-9-]+)/i);
    if (m) return m[1];
    m = text.match(/\b(FT(?=[A-Z0-9]*\d)[A-Z0-9]{8,15})\b/i);
    if (m) return m[1].toUpperCase();
    m = text.match(/transaction\s*(?:number|no|id)\.?(?:\s+is)?[\s:]*((?=[A-Z0-9]*\d)[A-Z0-9]{8,14})/i);
    if (m) return m[1].toUpperCase();
    m = text.match(/\b((?=[A-Z0-9]*[A-Z])(?=[A-Z0-9]*\d)[A-Z0-9]{10,12})\b/);
    if (m) return m[1];
    if (direct) {
      const t = text.trim().replace(/\s+/g, "");
      if (/^[A-Za-z0-9-]{6,40}$/.test(t)) return t.toUpperCase();
    }
    return null;
  }

  async function readImage(file) {
    if (typeof Tesseract === "undefined") throw new Error("no ocr");
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    URL.revokeObjectURL(url);
    const s = Math.min(1, 1600 / img.width), c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const r = await Tesseract.recognize(c, "eng", {
      logger: (m) => { if (m.status === "recognizing text") setLoading(true, "ፎቶውን በማንበብ ላይ... " + Math.round(m.progress * 100) + "%"); }
    });
    return r.data.text;
  }

  async function callApi(ref) {
    const p = { action: "verify", ref: ref };
    if (HAS_LINK) { p.order = ORDER; p.amount = AMOUNT; p.sig = SIG; }
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 40000);
    try {
      const r = await fetch(API_URL + "?" + new URLSearchParams(p).toString(), { signal: ctl.signal });
      return await r.json();
    } finally { clearTimeout(timer); }
  }

  async function verifyPayment() {
    hideResult();
    if (API_URL.indexOf("PUT_YOUR") === 0) return show("error", "ቅንብር ያልተጠናቀቀ", "API_URL አልተሞላም።");
    if (HAS_LINK && !LINK_OK) return show("error", "ትክክል ያልሆነ ሊንክ", "እባክዎ ከአገልግሎት ሰጪው የተላከልዎትን ሊንክ ተጠቅመው ይግቡ።");

    let ref = null;
    if (method === "image") {
      const f = $("receiptImage").files[0];
      if (!f) return show("error", "ስክሪንሹት አልተመረጠም", "እባክዎ የክፍያ ደረሰኝ ፎቶ ይምረጡ።");
      setLoading(true, "ፎቶውን በማንበብ ላይ...");
      try { ref = extractRef(await readImage(f), false); }
      catch (e) { setLoading(false); return show("error", "ፎቶውን ማንበብ አልተቻለም", "'Trx No' ወይም 'ሙሉ SMS' ትርን ይጠቀሙ።"); }
    } else if (method === "sms") ref = extractRef($("smsText").value, false);
    else ref = extractRef($("trxText").value, true);

    if (!ref) {
      setLoading(false);
      return show("error", "ማጣቀሻ አልተገኘም", "የክፍያ ቁጥር (FT፣ v2 ሊንክ ወይም Trx No) አልተገኘም። ሙሉውን ያስገቡ ወይም ቁጥሩን በ 'Trx No' ትር ይጻፉ።");
    }
    setLoading(true, "በማረጋገጥ ላይ...");
    try { handle(await callApi(ref), ref); }
    catch (e) { show("error", "የኔትወርክ ስህተት", "ከሰርቨር ጋር መገናኘት አልተቻለም። ደግመው ይሞክሩ።"); }
    finally { setLoading(false); }
  }

  function handle(d, ref) {
    const read = "\nያነበብነው ቁጥር: " + ref;
    const got = d.amount ? "\nተቀብለናል: " + d.amount + " ብር" : "";
    switch (d.status) {
      case "Verified": return show("success", "ክፍያዎ ተረጋግጧል!", "ላኪ: " + d.from_to + got + "\nRef: " + d.ref_no);
      case "OrderDone": return show("success", "ይህ ትዕዛዝ ቀደም ብሎ ተረጋግጧል", "ላኪ: " + d.from_to + got + "\nRef: " + d.ref_no);
      case "AlreadyUsed": return show("error", "ክፍያው ተጠቅሟል!", "ይህ የክፍያ ቁጥር ከዚህ በፊት ጥቅም ላይ ውሏል።" + read);
      case "InvalidAmount": return show("error", "የገንዘብ መጠን ስህተት!", "የሚጠበቀው: " + d.expected + " ብር\nየተከፈለው: " + d.actual + " ብር");
      case "Expired": return show("error", "ጊዜው ያለፈበት ደረሰኝ!", "ይህ ደረሰኝ ከ 24 ሰዓት በላይ ስለቆየ አገልግሎት አይሰጥም።");
      case "Bad_Link": return show("error", "ትክክል ያልሆነ ሊንክ", "እባክዎ አዲስ ሊንክ ይጠይቁ።");
      case "TooMany": return show("warning", "ብዙ ሙከራ ተደርጓል", "ከ 10 ደቂቃ በኋላ ደግመው ይሞክሩ።");
      case "System_Busy": return show("warning", "ሲስተሙ ስራ ላይ ነው", "ከ 10 ሰከንድ በኋላ ደግመው ይሞክሩ።");
      case "Pending": return show("warning", "ክፍያው አልተገኘም", "ክፍያዎ ገና ሲስተማችን ላይ አልደረሰም ወይም ቁጥሩ ተሳስቷል። ጥቂት ሰከንዶች ጠብቀው ይሞክሩ። ፎቶ ከሆነ ቁጥሩ በትክክል ላይነበብ ይችላል፣ በ 'Trx No' ትር ይጻፉት።" + read);
      default: return show("error", "የሲስተም ስህተት", "ቆይተው ይሞክሩ።");
    }
  }

  function setLoading(on, text) {
    $("verifyBtn").disabled = on;
    $("verifyBtn").classList.toggle("opacity-75", on);
    $("btnText").textContent = text || "ክፍያውን አረጋግጥ";
  }
  function hideResult() { $("resultBox").classList.add("hidden"); }
  function show(type, title, details) {
    const s = { success: ["bg-green-50 border-green-200", "text-green-800"], error: ["bg-red-50 border-red-200", "text-red-800"], warning: ["bg-orange-50 border-orange-200", "text-orange-800"] }[type];
    $("resultBox").className = "mt-5 p-4 rounded-xl border text-sm " + s[0];
    $("resultTitle").className = "font-bold text-base mb-1 " + s[1];
    $("resultTitle").textContent = title;
    $("resultDetails").textContent = details;
  }
  setMethod("image");
</script>
</body>
</html>
