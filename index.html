<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telebirr Payment Gateway</title>
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .gateway-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #0ea5e9;
        }
        h2 { text-align: center; color: #0284c7; margin-top: 0; font-size: 22px; }
        .merchant-info {
            background-color: #f0f9ff;
            border: 1px dashed #7dd3fc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .merchant-info h3 { margin: 0; color: #0369a1; font-size: 18px; }
        .merchant-info p { margin: 5px 0 0 0; color: #0c4a6e; font-size: 14px; }
        label { font-weight: bold; font-size: 14px; color: #4b5563; display: block; margin-bottom: 5px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            margin-bottom: 15px;
            background-color: #f9fafb;
        }
        input:focus, textarea:focus { outline: none; border-color: #0ea5e9; background-color: #fff; }
        .verify-btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .verify-btn:hover { background-color: #0284c7; }
        .verify-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
        .alert-success { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .alert-warning { background-color: #fef3c7; color: #92400e; border: 1px solid #fbbf24; }
    </style>
</head>
<body>

<div class="gateway-card">
    <h2>የክፍያ ማረጋገጫ (Payment Gateway)</h2>

    <div class="merchant-info">
        <h3>0996910607</h3>
        <p>Aymen</p>
    </div>

    <label>የላኩት የብር መጠን</label>
    <input type="number" id="amountInput" placeholder="ምሳሌ: 100" min="1">

    <label>የግብይት ቁጥር (Ref) ወይም ሙሉ SMS</label>
    <textarea id="refInput" rows="3" placeholder="ምሳሌ: DJC5Q7Q5UV"></textarea>
    
    <button id="verifyBtn" class="verify-btn" onclick="verifyTransaction()">ክፍያውን አረጋግጥ</button>

    <div id="statusAlert" class="alert"></div>
</div>

<script>
    async function verifyTransaction() {
        let rawRef = document.getElementById('refInput').value.trim();
        let amount = document.getElementById('amountInput').value.trim();
        const verifyBtn = document.getElementById('verifyBtn');
        const alertBox = document.getElementById('statusAlert');

        alertBox.style.display = 'none';
        alertBox.className = 'alert';

        // ሙሉ SMS ከተለጠፈ Ref እና Amount አውጣ
        if (rawRef.length > 15) {
            const refMatch = rawRef.match(/transaction\s*(?:number|no|id)\s*(?:is)?[\s:]*([A-Z0-9]{10,12})\b/i) || rawRef.match(/\b([A-Z0-9]{10,12})\b/);
            if (refMatch) rawRef = refMatch[1].toUpperCase();

            const amtMatch = rawRef.match(/(?:transferred|paid)\s+(?:ETB|Birr)\s*([0-9,]+(?:\.[0-9]{1,2})?)/i);
            if (amtMatch && !amount) {
                amount = amtMatch[1].replace(/,/g, '');
                document.getElementById('amountInput').value = amount;
            }
        }

        if (!amount || amount <= 0) {
            showAlert("እባክዎ ትክክለኛ የብር መጠን ያስገቡ።", "alert-warning");
            return;
        }
        if (!rawRef || rawRef.length < 9) {
            showAlert("እባክዎ ትክክለኛ የቴሌብር የግብይት ቁጥር (Ref) ያስገቡ።", "alert-warning");
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.innerText = "በማረጋገጥ ላይ...";

        try {
            // የአንተ ቋሚ የ Render ኤፒአይ ሊንክ (Gateway)
            const apiUrl = `https://verifi-server.onrender.com/api/verify?token=Verifi_Prod_9842_Aymen_X9!2026&ref=${rawRef}&amount=${amount}`;
            
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data.status === 'Verified') {
                showAlert(`✅ ተረጋግጧል! ${data.amount} ብር ገቢ ሆኗል።`, "alert-success");
                verifyBtn.innerText = "ክፍያው ተሳክቷል";
            } 
            else if (data.status === 'Pending') {
                showAlert("⏳ ክፍያው አልደረሰም ወይም Ref ተሳስቷል። ትንሽ ቆይተው ይሞክሩ።", "alert-warning");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "ክፍያውን አረጋግጥ";
            } 
            else if (data.status === 'InvalidAmount') {
                showAlert(`⚠️ ያስገቡት የብር መጠን እና የላኩት ብር አይገናኝም! ትክክለኛው የላኩት ${data.actual} ብር ነው።`, "alert-warning");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "ክፍያውን አረጋግጥ";
            } 
            else if (data.status === 'AlreadyUsed') {
                showAlert("❌ ይህ ደረሰኝ ከዚህ በፊት ጥቅም ላይ ውሏል!", "alert-error");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "ክፍያውን አረጋግጥ";
            } 
            else {
                showAlert("❌ ትክክለኛ የገቢ ክፍያ አይደለም።", "alert-error");
                verifyBtn.disabled = false;
                verifyBtn.innerText = "ክፍያውን አረጋግጥ";
            }
        } catch (error) {
            showAlert("⚠️ ከሰርቨር ጋር መገናኘት አልተቻለም። ኢንተርኔትዎን ያረጋግጡ።", "alert-error");
            verifyBtn.disabled = false;
            verifyBtn.innerText = "ክፍያውን አረጋግጥ";
        }
    }

    function showAlert(message, className) {
        const alertBox = document.getElementById('statusAlert');
        alertBox.innerText = message;
        alertBox.className = `alert ${className}`;
        alertBox.style.display = 'block';
    }
</script>
</body>
</html>
